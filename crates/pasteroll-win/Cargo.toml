[package]
name = "pasteroll-win"
version = "0.1.0-beta.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pasteroll"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
pasteroll-app = { version = "0.1.0-beta.1", path = "../pasteroll-app" }
pasteroll-core = { version = "0.1.0-beta.1", path = "../pasteroll-core" }
pasteroll-render = { version = "0.1.0-beta.1", path = "../pasteroll-render" }
rpassword = "7.5.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Security", "Win32_System_SystemInformation", "Foundation_Numerics", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_IO", "Win32_Storage_Xps", "Win32_System_Registry", "Win32_System_Console", "Win32_System_Time", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections"] }
windows-numerics = "0.3.1"
zeroize = "1.9.1"
